name: honey_bird
description: "a app for sharing and discovering recipes and cooking tips, allowing users to connect with a community of food enthusiasts and explore a wide range of culinary delights."
version: 2.0.18+904

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  get_it: ^7.6.4
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  intl: ^0.19.0
  flutter_bloc: ^8.1.6
  google_fonts: ^6.3.3
  go_router: ^17.0.1
  
  # Firebase dependencies
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  image_picker: ^1.0.7
  package_info_plus: ^8.1.2
  flutter_native_splash: ^2.4.7
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.5
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/primary.png"
  macos:
    generate: true
    image_path: "assets/logo/primary.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo/primary.png"
  android_12:
    color: "#ffffff"
    image: "assets/logo/primary.png"

flutter:
  uses-material-design: true

  assets:
    - assets/docs/
    - assets/logo/
    - assets/fonts/
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

