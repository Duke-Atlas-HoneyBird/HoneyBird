name: Build on Tag

on:
  push:
    tags:
      - '*'  # Triggers on any tag push

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  check-tag:
    name: Check if tag is on develop
    runs-on: ubuntu-latest
    outputs:
      is_on_develop: ${{ steps.check.outputs.is_on_develop }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to check branch

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Check if tag is on develop branch
        id: check
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_COMMIT=$(git rev-parse $TAG_NAME)
          if git branch -r --contains $TAG_COMMIT | grep -q "origin/develop"; then
            echo "is_on_develop=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME is on develop branch"
          else
            echo "is_on_develop=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME is not on develop branch, skipping build"
          fi

  build-android:
    name: Build Android
    needs: check-tag
    if: needs.check-tag.outputs.is_on_develop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create Firebase / Google config files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          [ -f android/app/google-services.json ] || printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          [ -f lib/firebase_options.dart ] || printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Create signing keystore and key.properties (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          [ -f android/app/release.keystore ] || echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          if [ ! -f android/key.properties ]; then
            mkdir -p android
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=app/release.keystore" >> android/key.properties
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  release:
    name: Create Release and Upload APK
    needs: [check-tag, build-android]
    if: needs.check-tag.outputs.is_on_develop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Prepare APK for release
        run: |
          if [ -f android-apk/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp android-apk/build/app/outputs/flutter-apk/app-release.apk "honey_bird-${{ github.ref_name }}.apk"
          else
            cp android-apk/app-release.apk "honey_bird-${{ github.ref_name }}.apk"
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: honey_bird-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS
    needs: check-tag
    if: needs.check-tag.outputs.is_on_develop == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create Firebase / Google config files
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          [ -f ios/GoogleService-Info.plist ] || printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/GoogleService-Info.plist
          [ -f lib/firebase_options.dart ] || printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

  build-web:
    name: Build Web
    needs: check-tag
    if: needs.check-tag.outputs.is_on_develop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          [ -f lib/firebase_options.dart ] || printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 30
